RangerLocalPlanner:
  # Geometry and motion limits come exclusively from motion_policy_file.
  # The installed launch selects that file and operation_mode.
  state_topic: /workbench_nav/coarse_navigation_state
  local_plan_topic: /move_base/RangerLocalPlanner/local_plan
  # Mandatory operation-scoped measured pose progress, in ROS/source seconds.
  progress_timeout_s: 45.0
  progress_min_translation_m: 0.2
  progress_min_rotation_rad: 0.1
  rate_limit_max_dt_s: 0.20
  curvature_tracking_slowdown_per_m: 0.25
  xy_goal_tolerance_m: 0.15
  yaw_goal_tolerance_rad: 0.20
