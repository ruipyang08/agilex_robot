schema_version: 3
output_rate_hz: 20.0
freshness:
  navigation_command_receipt_s: 0.25
  navigation_startup_grace_s: 0.50
  docking_command_receipt_s: 0.25
  lidar_receipt_s: 0.25
  lidar_header_s: 0.25
  odometry_receipt_s: 0.25
  odometry_header_s: 0.35
  maximum_header_future_skew_s: 0.05
limits:
  max_linear_x_mps: 0.50
  max_linear_y_mps: 0.40
  max_angular_z_radps: 0.80
  zero_epsilon: 1.0e-9
handover:
  stop_linear_speed_mps: 0.020
  stop_angular_speed_radps: 0.010
  stop_dwell_s: 0.50

# Candidate command/evidence bounds; these do not qualify physical acceleration.
motion:
  max_linear_speed_lead_mps: 0.002
  max_angular_speed_lead_radps: 0.004
  min_turn_radius_m: 0.4764
pose_feedback:
  parent_frame: odom
  child_frame: rslidar
  command_frame: base_link
  min_interval_s: 0.0001
  max_interval_s: 0.25
  max_translation_step_m: 0.2
  max_rotation_step_rad: 0.35
  max_linear_speed_mps: 1.0
  max_angular_speed_radps: 2.0
  quaternion_norm_tolerance: 1.0e-06
  extrinsic_translation_tolerance_m: 1.0e-09
  extrinsic_rotation_tolerance_rad: 1.0e-09
