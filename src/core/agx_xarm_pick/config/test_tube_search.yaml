tube_grasp:
  motion:
    search:
      centerline_y_m: 0.0
      initial_centerline_tolerance_m: 0.005
      centerline_joint_position_rad: 0.0
      centerline_joint_tolerance_rad: 0.020
      initial_tcp_x_bounds_m: [0.10, 0.30]
      initial_tcp_z_bounds_m: [-0.10, 0.05]
      view_region:
        x_bounds_m: [0.45, 0.65]
        preferred_x_m: 0.55
        clearance_above_cap_bounds_m: [0.03, 0.25]
        preferred_clearance_above_cap_m: 0.06
        sampling_step_m: 0.025
        entry_y_m: 0.0
        waypoint_y_tolerance_m: 0.005
        maximum_candidate_attempts: 8
        planning_time_per_candidate_sec: 2.0
      visual_alignment:
        # Commissioned at the retained close top-down viewpoint. Two normal
        # mission traces measured 0.000368-0.000385 m/px; 0.00038 avoids the
        # overshoot produced by the earlier distant-view 0.00075 estimate.
        u_axis_gain_m_per_px: 0.00038
        v_axis_gain_m_per_px: 0.00038
        target_center_tolerance_px: 8.0
        required_centered_observations: 2
        maximum_step_m: 0.05
        minimum_retry_step_m: 0.00625
        maximum_total_displacement_m: 0.20
        maximum_iterations: 12
        stationary_target_retries: 2
        minimum_pixel_error_improvement_px: 1.0
      observation_y_positions_m: [0.050, 0.025, 0.0, -0.025, -0.050]
      downward_axis_tolerance_deg: 2.0
      minimum_adjacent_view_overlap: 0.20
      settle_duration_sec: 0.75
      detector_attempts_per_waypoint: 2
