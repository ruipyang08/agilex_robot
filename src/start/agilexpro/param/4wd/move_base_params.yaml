base_global_planner: global_planner/GlobalPlanner
base_local_planner: dwa_local_planner/DWAPlannerROS

shutdown_costmaps: false

controller_frequency: 10 #before 5.0
controller_patience: 15.0

planner_frequency: 5.0 #0.5
planner_patience: 5.0

oscillation_timeout: 20.0
oscillation_distance: 0.2

conservative_reset_dist: 3 #distance from an obstacle at which it will unstuck itself

recovery_behaviors:
  - name: conservative_reset
    type: clear_costmap_recovery/ClearCostmapRecovery
  - name: bounded_rotate_recovery
    type: rotate_recovery/RotateRecovery

conservative_reset:
  reset_distance: 3.0

cost_factor: 1 #0.55 #1
neutral_cost: 55 #66 #55
lethal_cost: 253

# ROS1 rotate_recovery loads its velocity and acceleration limits from the
# legacy TrajectoryPlannerROS namespace even when DWAPlannerROS is selected.
# Keep those actual inputs below the autonomous arbiter ceiling.
TrajectoryPlannerROS:
  acc_lim_theta: 1.0
  max_vel_theta: 0.30
  min_in_place_vel_theta: 0.10
  yaw_goal_tolerance: 0.10

bounded_rotate_recovery:
  frequency: 10.0
